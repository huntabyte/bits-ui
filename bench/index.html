<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bits UI Bench</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				font-family: system-ui, sans-serif;
				font-size: 14px;
			}
			.popup {
				background: #fff;
				border: 1px solid #ccc;
				border-radius: 6px;
				box-shadow: 0 4px 16px rgb(0 0 0 / 0.1);
			}
			.listbox {
				max-height: 400px;
				overflow-y: auto;
				width: 240px;
			}
			.item {
				padding: 4px 8px;
				border-radius: 4px;
				outline: none;
			}
			.item[data-highlighted] {
				background: #2563eb;
				color: #fff;
			}
			.item[data-state="checked"] {
				font-weight: 600;
			}
			.trigger {
				padding: 6px 12px;
				border: 1px solid #ccc;
				border-radius: 6px;
				background: #f9f9f9;
			}
			.overlay {
				position: fixed;
				inset: 0;
				background: rgb(0 0 0 / 0.4);
			}
			.dialog {
				position: fixed;
				left: 50%;
				top: 50%;
				transform: translate(-50%, -50%);
				width: 400px;
				padding: 16px;
			}
			.outside-node {
				display: inline-block;
				width: 8px;
				height: 8px;
				margin: 1px;
				background: #e5e5e5;
			}
			.trigger-grid {
				display: flex;
				flex-wrap: wrap;
				gap: 4px;
			}
		</style>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
