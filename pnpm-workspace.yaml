packages:
  - packages/*
  - docs
  - tests
  - bundle-analyzer

# runed is held at 0.35 to match svelte-toolbelt (avoids shipping two copies);
# its optional kit peer is only ^2. Drop this once svelte-toolbelt moves to runed >=0.38.
peerDependencyRules:
  allowedVersions:
    'runed>@sveltejs/kit': '3'

catalog:
  '@sveltejs/kit': 3.1.1
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@tailwindcss/vite': ^4.3.4
  '@types/node': ^22.0.0
  playwright: ^1.64.1
  runed: ^0.35.1
  svelte: 5.57.3
  svelte-check: ^4.7.8
  tailwindcss: ^4.3.4
  typescript: ^6.0.3
  vite: ^8.3.5
  vitest: ^5.1.0
  vitest-browser-svelte: ^3.1.0
